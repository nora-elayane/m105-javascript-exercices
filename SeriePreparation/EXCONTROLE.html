<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nb ;
        do{
            nb = parseInt(prompt("donner un nombre :")) ;
        }while(isNaN(nb)) 
        let affichage = "les 6 premier multiples carrés sont :  " 
        for(let i = 1 ; i <= 6 ; i++){
            affichage += (nb * i) ** 2 ;
            if(i < 6){
                 affichage += " , " ;
                }
                
        }
        console.log(affichage) ;
    </script>
</body>
</html>
